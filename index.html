<div class="stage">

    <p>SSU HCI 10조 프로토타입입니다. 휴대폰으로 열면 전체 화면으로 볼 수 있어요.</p>

<script>
// GitHub Pages는 이 파일을 10분간 캐시한다. 그래서 최신 버전 번호를 캐시 없이 먼저 확인하고
// 그 번호로 스타일과 앱을 불러온다. 다시 불러오기(새로고침) 없이 항상 최신 화면이 열린다.
(function () {
  var FALLBACK = "11160918";
  function load(v) {
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "css/style.css?v=" + v;
    l.onload = l.onerror = function () {
      var s = document.createElement("script");
      s.type = "module"; s.src = "js/app.js?v=" + v;
      document.body.appendChild(s);
    };
    document.head.appendChild(l);
  }
  fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) { load(j.v || FALLBACK); }, function () { load(FALLBACK); });
})();
</script>
